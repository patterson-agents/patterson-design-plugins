<!-- @dsCard group="Components" viewport="700x460" name="Core — Buttons, Badges, Stat, Card" subtitle="Primary action set in the Patterson brand" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-subtle); }
  .group { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-pat); padding: 18px; margin-bottom: 14px; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-bottom: 12px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>

  <div class="group">
    <div class="label">Buttons — variants</div>
    <div class="row">
      <button type="button" class="pat-btn pat-btn--primary">What we do</button>
      <button type="button" class="pat-btn pat-btn--navy">Join us</button>
      <button type="button" class="pat-btn pat-btn--outline">Our company</button>
      <button type="button" class="pat-btn pat-btn--ghost">Learn more</button>
      <button type="button" class="pat-btn pat-btn--primary">Newsroom
        <span class="pat-btn__icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </button>
      <button type="button" class="pat-btn pat-btn--primary" disabled>Disabled</button>
    </div>
  </div>

  <div class="group" style="display:flex; gap:28px; flex-wrap:wrap; align-items:center">
    <div>
      <div class="label">Sizes</div>
      <div class="row">
        <button type="button" class="pat-btn pat-btn--primary pat-btn--sm">Small</button>
        <button type="button" class="pat-btn pat-btn--primary pat-btn--md">Medium</button>
        <button type="button" class="pat-btn pat-btn--primary pat-btn--lg">Large</button>
      </div>
    </div>
    <div>
      <div class="label">Icon buttons</div>
      <div class="row">
        <button type="button" class="pat-icon-btn pat-icon-btn--solid" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
        <button type="button" class="pat-icon-btn pat-icon-btn--sky" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
        <button type="button" class="pat-icon-btn pat-icon-btn--subtle" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
        <button type="button" class="pat-icon-btn pat-icon-btn--ghost" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
      </div>
    </div>
  </div>

  <div class="group">
    <div class="label">Badges</div>
    <div class="row">
      <span class="pat-badge pat-badge--navy">Corporate</span>
      <span class="pat-badge pat-badge--sky pat-badge--solid">New</span>
      <span class="pat-badge pat-badge--teal">In stock</span>
      <span class="pat-badge pat-badge--green">Sustainable</span>
      <span class="pat-badge pat-badge--purple">Equine</span>
      <span class="pat-badge pat-badge--warning">Pending</span>
      <span class="pat-badge pat-badge--danger">Backordered</span>
    </div>
  </div>

  <div class="row" style="align-items:stretch">
    <div class="pat-card pat-card--accent-sky" style="flex:1; min-width:220px">
      <div class="pat-stat pat-stat--sky">
        <span class="pat-stat__value">98%</span>
        <span class="pat-stat__label">of customers reached in 1–2 days</span>
      </div>
    </div>
    <div class="pat-card pat-card--accent-navy pat-card--interactive" style="flex:1; min-width:220px">
      <h3 class="pat-card__title">Patterson Dental</h3>
      <p class="pat-card__description">Everyday essentials and software to run the practice.</p>
    </div>
  </div>

</body>
</html>
