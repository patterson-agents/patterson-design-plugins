<!-- @dsCard group="Components" viewport="700x460" name="Forms — Input, Select, Checkbox, Radio, Switch" subtitle="Field controls with sky focus ring" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-subtle); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-pat); padding: 22px; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .group-label { font-size: var(--fs-dpl-small); font-weight: var(--fw-semibold); color: var(--text-heading); margin-bottom: 10px; }
</style>
</head>
<body>

  <div class="grid">
    <div class="stack">

      <div class="pat-field">
        <label class="pat-field__label" for="f-email">Work email <span class="pat-field__required">*</span></label>
        <div class="pat-field__control">
          <span class="pat-field__icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></span>
          <input class="pat-input" id="f-email" type="email" placeholder="you@practice.com" required>
        </div>
      </div>

      <div class="pat-field">
        <label class="pat-field__label" for="f-practice">Practice name</label>
        <div class="pat-field__control">
          <input class="pat-input" id="f-practice" type="text" value="Cedar Dental">
        </div>
        <span class="pat-field__helper">As it appears on your account</span>
      </div>

      <div class="pat-field pat-field--error">
        <label class="pat-field__label" for="f-account">Account number</label>
        <div class="pat-field__control">
          <input class="pat-input" id="f-account" type="text" value="000-114" aria-invalid="true" aria-describedby="f-account-err">
        </div>
        <span class="pat-field__error" id="f-account-err">We couldn't find that account</span>
      </div>

      <div class="pat-field">
        <label class="pat-field__label" for="f-market">Market</label>
        <div class="pat-select__wrap">
          <select class="pat-select" id="f-market">
            <option>Dental</option>
            <option>Veterinary</option>
            <option>Production animal</option>
            <option>Equine</option>
          </select>
          <span class="pat-select__chevron"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
        </div>
      </div>

    </div>
    <div class="stack">

      <label class="pat-switch" for="f-reorder">
        <input class="pat-switch__input" id="f-reorder" type="checkbox" checked>
        <span class="pat-switch__label">Auto-reorder everyday essentials</span>
      </label>

      <label class="pat-switch" for="f-pause">
        <input class="pat-switch__input" id="f-pause" type="checkbox">
        <span class="pat-switch__label">Pause email notifications</span>
      </label>

      <label class="pat-checkbox" for="f-news">
        <input class="pat-checkbox__input" id="f-news" type="checkbox" checked>
        <span class="pat-checkbox__label">Email me Patterson news</span>
      </label>

      <label class="pat-checkbox" for="f-terms">
        <input class="pat-checkbox__input" id="f-terms" type="checkbox">
        <span class="pat-checkbox__label">I agree to the terms of use</span>
      </label>

      <div>
        <div class="group-label" id="f-market-legend">Primary market</div>
        <div class="pat-radio-group" role="radiogroup" aria-labelledby="f-market-legend">
          <label class="pat-radio" for="f-m1"><input class="pat-radio__input" id="f-m1" type="radio" name="m" value="Dental" checked><span class="pat-radio__label">Dental</span></label>
          <label class="pat-radio" for="f-m2"><input class="pat-radio__input" id="f-m2" type="radio" name="m" value="Veterinary"><span class="pat-radio__label">Veterinary</span></label>
          <label class="pat-radio" for="f-m3"><input class="pat-radio__input" id="f-m3" type="radio" name="m" value="Production animal"><span class="pat-radio__label">Production animal</span></label>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
